# Chromatic — publish Storybook and run visual regression tests.
#
# Runs automatically only on pushes to main, keeping the baseline chain on the
# default branch unbroken. Feature branches run on demand via
# workflow_dispatch (Actions tab → Chromatic → Run workflow → pick branch, or
# `gh workflow run chromatic.yml --ref <branch>`) — this avoids burning the
# snapshot quota on every branch push; when the quota is exhausted, runs sit
# pending on PRs. A manual branch run still TurboSnaps against the merge-base
# build on main; skipped branch commits just mean a larger diff in that one
# run, not orphaned baselines.
#
# Cost control comes from TurboSnap (--only-changed): Chromatic traces the
# Vite dependency graph and only snapshots stories affected by the diff.
#
# Required repo secret (Settings → Secrets and variables → Actions):
#   CHROMATIC_PROJECT_TOKEN   from Chromatic → Project → Manage → Configure

name: Chromatic

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic requires full git history to find baseline commits.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Uses the lockfile-pinned chromatic CLI (package.json "chromatic" script
      # supplies --build-script-name=storybook:build).
      #   --only-changed         TurboSnap: snapshot only stories affected by the diff
      #   --auto-accept-changes  main is the source of truth; changes merged to main
      #                          were already reviewed on the feature branch
      #   --exit-zero-on-changes visual diffs are reviewed in Chromatic, not as CI failures
      - name: Run Chromatic
        run: >-
          pnpm chromatic
          --only-changed
          --auto-accept-changes main
          --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
