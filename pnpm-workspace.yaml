# pnpm project settings (https://pnpm.io/settings). Everything else is
# pnpm 11 defaults, including the 24h minimumReleaseAge cooldown.

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  bufferutil: false
  utf-8-validate: false
  # Downloads the sentry-cli binary used for source map upload at build time.
  '@sentry/cli': true
  # Postinstall only prints a funding message.
  core-js: false
  # Downloads the platform ffmpeg binary used to extract video poster frames.
  ffmpeg-static: true

# Single source of truth for versions that package.json and the overrides
# below both need, referenced via the catalog: protocol.
catalog:
  '@sentry/nextjs': ^10.65.0
  # Exact pin: native libvips binary; follow the Payload template's pin.
  sharp: 0.35.4

overrides:
  # @payloadcms/plugin-sentry hard-depends on @sentry/nextjs@^9, which neither
  # supports Next 16 nor shares the SDK instance our app initializes — its
  # AdminErrorBoundary would capture into a second, uninitialized SDK. Force it
  # onto the app's v10 SDK (it only uses ErrorBoundary, which v10 exports).
  '@payloadcms/plugin-sentry>@sentry/nextjs': 'catalog:'
  # One sharp for the whole tree, at the catalog pin. webreel still declares
  # ^0.34, which carries the libvips and libheif advisories fixed in 0.35.4;
  # it only uses png/resize/metadata/composite.
  sharp: 'catalog:'
  # drizzle-kit (a Payload db adapter dependency) loads configs through
  # @esbuild-kit/core-utils, which pins esbuild 0.18 (GHSA-67mh-4wv8-2f99).
  # It only calls the transform API; move it onto drizzle-kit's own esbuild line.
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
  # Payload 3.90.2 pins undici 7.29.0 exactly (GHSA-3wwx-pv8p-q78v, fixed in
  # 7.29.1). It only uses undici's fetch and Agent for upload safeFetch; move
  # it onto the patch release, the same copy jsdom already resolves.
  'payload>undici': 7.29.1

patchedDependencies:
  '@payloadcms/drizzle': patches/@payloadcms__drizzle.patch
  '@payloadcms/next': patches/@payloadcms__next.patch
  '@payloadcms/plugin-mcp': patches/@payloadcms__plugin-mcp.patch
  '@webreel/core@0.1.4': patches/@webreel__core@0.1.4.patch
