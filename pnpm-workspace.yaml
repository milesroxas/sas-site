# pnpm project settings (https://pnpm.io/settings). Everything else is
# pnpm 11 defaults, including the 24h minimumReleaseAge cooldown.

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  bufferutil: false
  utf-8-validate: false
  '@sentry/cli': set this to true or false
  core-js: set this to true or false
