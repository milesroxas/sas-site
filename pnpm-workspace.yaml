# pnpm project settings (https://pnpm.io/settings). Everything else is
# pnpm 11 defaults, including the 24h minimumReleaseAge cooldown.

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  bufferutil: false
  utf-8-validate: false
  # Downloads the sentry-cli binary used for source map upload at build time.
  '@sentry/cli': true
  # Postinstall only prints a funding message.
  core-js: false
  # Downloads the platform ffmpeg binary used to extract video poster frames.
  ffmpeg-static: true
  # Transitive deps of @ai-stack/payloadcms (Google provider path). Postinstall
  # scripts are version-stamp/telemetry only; deny until proven needed.
  '@google/genai': false
  protobufjs: false

# Single source of truth for the Sentry SDK version — referenced from
# package.json and the override below via the catalog: protocol.
catalog:
  '@sentry/nextjs': ^10.65.0

overrides:
  # @payloadcms/plugin-sentry hard-depends on @sentry/nextjs@^9, which neither
  # supports Next 16 nor shares the SDK instance our app initializes — its
  # AdminErrorBoundary would capture into a second, uninitialized SDK. Force it
  # onto the app's v10 SDK (it only uses ErrorBoundary, which v10 exports).
  '@payloadcms/plugin-sentry>@sentry/nextjs': 'catalog:'

patchedDependencies:
  '@payloadcms/next': patches/@payloadcms__next.patch
  '@payloadcms/plugin-mcp': patches/@payloadcms__plugin-mcp.patch
