# Local Postgres for development. App runs on the host: pnpm dev
# Connection: postgresql://postgres@127.0.0.1:54320/payload (see .env.example)
# Bump POSTGRES_DOCKER_IMAGE in scripts/dev-tui/constants.ts together with `image:` below.
# Major/minor jumps usually need a fresh volume: docker compose down -v && pnpm db:up

# Fixed project name so every checkout (main repo, Conductor workspaces) targets the
# same container/volume — compose otherwise derives the project from the directory
# name, and `docker compose exec` in a workspace can't see the running container.
name: sas-site

services:
  postgres:
    # pgvector build of Postgres 18 — the Ask RAG embeddings need CREATE EXTENSION vector.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    ports:
      - '54320:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: payload
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # PG 18 images moved PGDATA under /var/lib/postgresql/18/… — mount the
      # parent, not the pre-18 /var/lib/postgresql/data, or nothing persists.
      - postgres_data:/var/lib/postgresql
      # Runs only on fresh-volume init: CREATE EXTENSION vector, so a clean
      # reset (down -v) leaves the DB ready for push without a manual step.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
